# Baut Melody für Windows (Setup.exe) und stellt es als Release zum Herunterladen bereit.
# Start: automatisch bei einem Versions-Tag (z. B. v3.0.0) oder von Hand unter „Actions“.
name: Windows-Setup

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: desktop
        run: npm ci
      - name: Setup bauen
        working-directory: desktop
        shell: bash
        run: npm run dist:win
      - name: Als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Setup
          path: desktop/dist/Melody-Setup-*.exe
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Melody ${{ github.ref_name }}
          body: |
            **Melody für Windows** – Setup herunterladen, doppelklicken, installieren.
            Beim ersten Start zeigt Windows evtl. „Der Computer wurde durch Windows geschützt“: auf „Weitere Informationen“ → „Trotzdem ausführen“ klicken.
          files: desktop/dist/Melody-Setup-*.exe
