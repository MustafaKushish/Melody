# Stellt Melody (ohne Server, wie die Demo) auf GitHub Pages bereit:
# https://<name>.github.io/Melody/ – von dort lässt sich Melody auf Handy und Tablet installieren.
name: Web-App (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Web-App bauen
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_KEY }}
        run: |
          bash tools/build-demo.sh _site
          # Eine Jamendo-Client-ID hat 8 Zeichen (a-f, 0-9). Längere Werte sind das „Client Secret“ und gehören nie in die Seite.
          if [[ "$JAMENDO_CLIENT_ID" =~ ^[0-9a-f]{8}$ ]]; then
            sed -i "s/__JAMENDO_CLIENT_ID__/${JAMENDO_CLIENT_ID}/" _site/js/jamendo.js
          else
            echo "::warning::Secret JAMENDO_KEY fehlt oder ist keine Jamendo-Client-ID (8 Zeichen) – Jamendo fragt im Browser nach der Client-ID."
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
