# Stellt Melody (ohne Server, wie die Demo) auf GitHub Pages bereit:
# https://<name>.github.io/Melody/ – von dort lässt sich Melody auf Handy und Tablet installieren.
# Restlos (Vorrats-App) liegt unter https://<name>.github.io/Melody/restlos/.
name: Web-App (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Web-App bauen
        run: |
          bash tools/build-demo.sh _site
          # Restlos (Vorrats-App) liegt daneben unter /restlos/
          mkdir -p _site/restlos
          cp -r restlos/index.html restlos/manifest.webmanifest restlos/sw.js restlos/css restlos/js restlos/icons _site/restlos/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
